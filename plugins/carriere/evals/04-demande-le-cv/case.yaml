schema_version: "1.0"
name: 04-demande-le-cv
execution:
  prompt: |
    Est-ce que je corresponds à cette offre ?

    Chef de projet marketing digital (H/F) — Brasserie Lumière — Lyon (69) — CDI

    Date limite de candidature : 30 novembre 2026. Rémunération : 42 000 à 48 000 € brut par an. Télétravail : 2 jours par semaine.

    Brasserie Lumière est une brasserie artisanale lyonnaise (35 salariés) qui vend en ligne et dans 120 points de vente. Nous lançons notre boutique en ligne européenne en 2027.

    Missions :
    - Piloter la stratégie d'acquisition payante (Google Ads, Meta Ads) avec un budget annuel de 150 000 €.
    - Encadrer une équipe de 2 personnes (un chargé de contenus, une alternante).
    - Suivre la performance avec Google Analytics 4 et présenter un reporting mensuel à la direction.
    - Piloter le CRM et l'emailing (HubSpot).
    - Coordonner le lancement de la boutique européenne avec nos partenaires en Allemagne et en Espagne.

    Profil :
    - Formation bac+5 en marketing ou école de commerce.
    - 5 ans d'expérience minimum en marketing digital.
    - Expérience réussie du management d'une équipe.
    - Maîtrise de Google Ads, Meta Ads et Google Analytics 4.
    - Idéalement : maîtrise de HubSpot, compétences en SEO.
    - Anglais courant indispensable ; l'espagnol est un plus.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: ["Skill", "Read", "Glob", "Grep", "Bash", "WebSearch"]
runs: 3
graders:
  - type: "regex"
    name: "demande-pdf-ou-docx"
    pattern: "PDF[\\s\\S]{0,40}DOCX|DOCX[\\s\\S]{0,40}PDF"
    flags: "i"
    match: "contains"
  - type: "llm"
    name: "pas-d-analyse-sans-cv"
    criteria: "PASS si la réponse demande le CV de l'utilisateur et ne donne ni score, ni tableau comparatif, ni verdict sur l'adéquation du profil."
