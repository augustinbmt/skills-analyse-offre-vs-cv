schema_version: "1.0"
name: 07-lettre-motivation
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Mon CV est cv-propre.docx (dossier courant). Voici l'offre :

    Chef de projet marketing digital (H/F) — Brasserie Lumière — Lyon (69) — CDI

    Date limite de candidature : 30 novembre 2026. Rémunération : 42 000 à 48 000 € brut par an. Télétravail : 2 jours par semaine.

    Brasserie Lumière est une brasserie artisanale lyonnaise (35 salariés) qui vend en ligne et dans 120 points de vente. Nous lançons notre boutique en ligne européenne en 2027.

    Missions :
    - Piloter la stratégie d'acquisition payante (Google Ads, Meta Ads) avec un budget annuel de 150 000 €.
    - Encadrer une équipe de 2 personnes (un chargé de contenus, une alternante).
    - Suivre la performance avec Google Analytics 4 et présenter un reporting mensuel à la direction.
    - Piloter le CRM et l'emailing (HubSpot).
    - Coordonner le lancement de la boutique européenne avec nos partenaires en Allemagne et en Espagne.

    Profil :
    - Formation bac+5 en marketing ou école de commerce.
    - 5 ans d'expérience minimum en marketing digital.
    - Expérience réussie du management d'une équipe.
    - Maîtrise de Google Ads, Meta Ads et Google Analytics 4.
    - Idéalement : maîtrise de HubSpot, compétences en SEO.
    - Anglais courant indispensable ; l'espagnol est un plus.

    Rédige directement la lettre de motivation, le brief pré-rempli me convient. Ce qui m'attire : le lancement de la boutique en ligne européenne en 2027. Colle la lettre dans ta réponse.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Read", "Glob", "Grep", "Bash", "WebSearch"]
runs: 3
graders:
  - type: "regex"
    name: "sans-cliches"
    pattern: "dynamique|motivée?|force de proposition|passionnée?|relever de nouveaux défis|véritable atout"
    flags: "i"
    match: "not_contains"
  - type: "llm"
    name: "lettre-conforme"
    criteria: |
      PASS si TOUTES ces affirmations sont vraies pour la lettre de la réponse :
      1. Le corps (hors en-tête, objet, formule d'appel, politesse, signature) fait 300 mots ou moins.
      2. Il compte 4 paragraphes : accroche, adéquation avec preuves, valeur ajoutée, conclusion avec proposition d'entretien.
      3. Il cite au moins un résultat chiffré du CV (2,6 %, 25 000 abonnés, +35 %, 8 000 €).
      4. Il ne prétend pas que la candidate a managé une équipe ni qu'elle maîtrise HubSpot.
      5. Il mentionne la boutique en ligne européenne.
      6. Il ne contient aucun crochet ni champ à compléter.
